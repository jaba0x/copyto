<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="CopyTo — real-time shared clipboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16263f"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14a597"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .wm   { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .line { fill: #0f1b2d; opacity: .5; }
    .pkt  { fill: #ffd35a; opacity: 0; }
    .fwd  { animation: fwd 2.6s cubic-bezier(.45,0,.55,1) infinite; }
    .bwd  { animation: bwd 2.6s cubic-bezier(.45,0,.55,1) infinite; animation-delay: 1.3s; }
    @keyframes fwd {
      0%{transform:translateX(0);opacity:0;} 12%{opacity:1;} 45%{opacity:1;}
      55%{transform:translateX(55px);opacity:0;} 100%{transform:translateX(55px);opacity:0;}
    }
    @keyframes bwd {
      0%{transform:translateX(0);opacity:0;} 12%{opacity:1;} 45%{opacity:1;}
      55%{transform:translateX(-55px);opacity:0;} 100%{transform:translateX(-55px);opacity:0;}
    }
    @media (prefers-reduced-motion: reduce){ .pkt{animation:none;opacity:1;} }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="310" cy="320" r="300" fill="url(#glow)"/>

  <!-- icon tile -->
  <g transform="translate(150 160) scale(1.25)">
    <rect width="256" height="256" rx="56" fill="#0b1524"/>
    <rect x="26" y="80" width="84" height="96" rx="16" fill="url(#scr)"/>
    <rect class="line" x="40" y="100" width="56" height="8" rx="4"/>
    <rect class="line" x="40" y="118" width="44" height="8" rx="4"/>
    <rect class="line" x="40" y="136" width="52" height="8" rx="4"/>
    <rect x="146" y="80" width="84" height="96" rx="16" fill="url(#scr)"/>
    <rect class="line" x="160" y="100" width="56" height="8" rx="4"/>
    <rect class="line" x="160" y="118" width="44" height="8" rx="4"/>
    <rect class="line" x="160" y="136" width="52" height="8" rx="4"/>
    <rect x="110" y="124" width="36" height="8" rx="4" fill="#2dd4bf" opacity=".35"/>
    <circle class="pkt fwd" cx="112" cy="128" r="6"/>
    <circle class="pkt bwd" cx="144" cy="128" r="6"/>
  </g>

  <!-- wordmark -->
  <text class="wm" x="560" y="316" font-size="132" font-weight="800" fill="#eef3f9" letter-spacing="-2">Copy<tspan fill="#2dd4bf">To</tspan></text>

  <!-- tagline -->
  <text class="wm" x="564" y="388" font-size="34" fill="#9fb2c8">Real-time shared clipboard.</text>
  <text class="wm" x="564" y="434" font-size="34" fill="#9fb2c8">Paste on one screen, see it on the other.</text>

  <!-- domain pill -->
  <rect x="564" y="476" width="230" height="48" rx="24" fill="none" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text class="wm" x="679" y="507" font-size="26" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">copy.jaba.ge</text>
</svg>
