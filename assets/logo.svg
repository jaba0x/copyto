<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CopyTo logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16263f"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14a597"/>
    </linearGradient>
  </defs>
  <style>
    .line { fill: #0f1b2d; opacity: .5; }
    .pkt  { fill: #ffd35a; opacity: 0; }
    .fwd  { animation: fwd 2.6s cubic-bezier(.45,0,.55,1) infinite; }
    .bwd  { animation: bwd 2.6s cubic-bezier(.45,0,.55,1) infinite; animation-delay: 1.3s; }
    .glow { fill: none; stroke: #8ff7e8; stroke-width: 3; opacity: 0; animation: glow 2.6s ease-out infinite; }
    @keyframes fwd {
      0%   { transform: translateX(0);   opacity: 0; }
      12%  { opacity: 1; }
      45%  { opacity: 1; }
      55%  { transform: translateX(44px); opacity: 0; }
      100% { transform: translateX(44px); opacity: 0; }
    }
    @keyframes bwd {
      0%   { transform: translateX(0);    opacity: 0; }
      12%  { opacity: 1; }
      45%  { opacity: 1; }
      55%  { transform: translateX(-44px); opacity: 0; }
      100% { transform: translateX(-44px); opacity: 0; }
    }
    @keyframes glow {
      0%, 50%, 100% { opacity: 0; }
      25%, 75%      { opacity: .7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pkt { animation: none; opacity: 1; }
      .glow { animation: none; }
    }
  </style>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- left screen (source) -->
  <g>
    <rect x="26" y="80" width="84" height="96" rx="16" fill="url(#scr)"/>
    <rect class="line" x="40" y="100" width="56" height="8" rx="4"/>
    <rect class="line" x="40" y="118" width="44" height="8" rx="4"/>
    <rect class="line" x="40" y="136" width="52" height="8" rx="4"/>
  </g>

  <!-- right screen (destination) -->
  <g>
    <rect x="146" y="80" width="84" height="96" rx="16" fill="url(#scr)"/>
    <rect class="line" x="160" y="100" width="56" height="8" rx="4"/>
    <rect class="line" x="160" y="118" width="44" height="8" rx="4"/>
    <rect class="line" x="160" y="136" width="52" height="8" rx="4"/>
  </g>

  <!-- sync channel -->
  <rect x="110" y="124" width="36" height="8" rx="4" fill="#2dd4bf" opacity=".35"/>

  <!-- packets syncing both directions -->
  <circle class="pkt fwd" cx="112" cy="128" r="6"/>
  <circle class="pkt bwd" cx="144" cy="128" r="6"/>
</svg>
