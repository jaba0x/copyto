name = "copyto"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Custom domain: copy.jaba.ge is served directly by this Worker.
# Wrangler provisions the DNS record and TLS cert on the jaba.ge zone.
routes = [
  { pattern = "copy.jaba.ge", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Set the room password as a secret, NOT here:
#   wrangler secret put ROOM_PASSWORD
