name = "copyto"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Custom domain: add copy.jaba.ge as a route after first deploy,
# or configure it in the Cloudflare dashboard under Workers Routes.
# routes = [
#   { pattern = "copy.jaba.ge", custom_domain = true }
# ]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Set the room password as a secret, NOT here:
#   wrangler secret put ROOM_PASSWORD
