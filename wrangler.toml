name = "copyto"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Custom domain: copy.jaba.ge is served directly by this Worker.
# Wrangler provisions the DNS record and TLS cert on the jaba.ge zone.
routes = [
  { pattern = "copy.jaba.ge", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITERS"
class_name = "IpLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpLimiter"]

# Rooms are keyed by the password the user types (hashed), so there is no
# server-wide secret to set. The old ROOM_PASSWORD secret is unused and can
# be removed with: wrangler secret delete ROOM_PASSWORD
